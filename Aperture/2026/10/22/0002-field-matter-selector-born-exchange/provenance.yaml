      (2) Clarifies that the Stage-1 harmonic-oscillator wave calculation predicts the complex interference
      field A_m = |A_m| e^{i phi^inc_m} across individual detector atoms (not pre-packaged fractional particle
      energies), and formulates pre-modulus 3-way phase coupling among the incident wave phase phi^inc_m,
      the surface-conditioned virtual quantum vacuum phase phi^vac_m (Casimir-Polder reflection pinning +
      detector bias field E_bias, modeled via a von Mises distribution kappa_surf), and the detector atom
      phase phi^det_m, with dominant-atom phase-pulling of the local vacuum mode (§2.3);
      (3) Replaces the 2-site Shannon entropy formula with the exact Kimura-Ohta (1969) N-site
      fixation-time formula E[tau] = -(2/(c_N sigma^2)) sum_i (1-s_i)ln(1-s_i) (§3.1, Table 3);
      (4) Proves Proposition 1 (1D Lumped Backward-Kolmogorov Obstruction) AND shows via two new atom-resolved
      simulations (code/run_atom_by_atom_aperture.py for 20 individual atoms and code/run_crystal_lattice_simulation.py
      for a 32-atom 2D condensed-matter crystal lattice with 4x4 sites/patch, coherent Bloch wavevector k.r_m,
      and nearest-neighbor exciton hopping) that resolving each macroscopic aperture region into M_1, M_2 >> 1
      individual atoms keeps every atom's initial share s_m(0) ~ S/M_1 << theta = 0.45 < 0.72, completely
      eliminating the lumped 1D backward-ODE distortion and the theta=0.45 breakdown (chi^2_Born = 5.59,
      p_val = 0.7801 at theta=0.72 with zero vacuum drift; chi^2_Born = 8.52, p_val = 0.4826 at theta=0.45;
      50/50 bright-fringe P_bright = 0.5016 for 5 vs 15 atoms and 0.4981 for 16 vs 16 crystal lattice sites)
      (§3.3, §4.2, §4.3, Tables 1-2, Fig. 2);
      (5) Grounds the spacelike nonlocality of the conserved one-quantum simplex and entangled Bell correlations
      directly in the psi-ontic theorem (Bell 1964; Pusey, Barrett & Rudolph 2012), replaces all constructed
      points in Figure 3 with genuine event-by-event Monte Carlo runs, removes the unsupported S=3.08 point,
