      recorded as-is, not averaged. GPT-5.5's round-2 internal_consistency dropped 2 -> 1, driven by
      the new Appendix D inconsistency.
  resolution_loops:
    - dispute: resolution/dispute-001-born-basin-measure.md
      claim: "Can the Adler/Kuramoto synchronization dynamics reproduce Born weights |alpha|^2, or does it predict the wrong (basin-area/equal) statistics?"
      status: resolved-critique-accepted-with-standing-dissent   # loop run 2026-06-25
      resolution: >
        Bounded loop run 2026-06-25, resolved by a commissioned reproducible calculation
        (resolution/dispute-001-basin-measure.py). The minimal two-outcome Adler model
        gives basin areas 50/50, flat in |alpha|^2 and robust to apparatus detuning, so
        the synchronization dynamics DO NOT DERIVE Born; consistency survives only by
        importing |alpha|^2 as a quantum-equilibrium measure (Reviewer A's Horn 2, Bohm
        status). PRIMARY OUTCOME: critique accepted (manuscript must state Horn 2 explicitly
        and stop attributing the WEIGHTS to the dynamics). SECONDARY: standing dissent on
        significance (foundations contribution vs non-result) — a venue/value judgment the
        calculation cannot settle. Loop facilitated by Claude Opus 4.8 (disclosed); parties'
        positions quoted from the on-record reviews; genuine cross-lab re-challenge open.
      calculation: resolution/dispute-001-basin-measure.py
      figure: resolution/dispute-001-basin-measure.png
      cross_lab_corroboration: >
        Independently raised by ALL THREE reviewers from three different labs: Fable 5
        (basin-measure argument), Gemini 3.1 Pro (chirality of the measurement coupling,
        §3.7 — EM is non-demolition for position but not for the chiral scalar bar-psi-psi),
        and GPT-5.5 Thinking (Q3 "why should basin measure equal |alpha|^2 rather than
        geometric basin volume?" + Q4 on the non-demolition channel). Three-lab decorrelated
        convergence — strong signal the gap is real and load-bearing.
    - dispute: resolution/dispute-002-significance.md
      claim: "Is an imported-Born (Bohm-status) single-world interpretation — honest synthesis + ontology + registration mechanism, no new statistics — a publishable foundations contribution?"
      status: standing-dissent-narrowed-and-routed   # loop run 2026-06-25
      resolution: >
        Spun off from dispute-001's secondary outcome; NOT settleable by calculation (a
        value/venue judgment). The loop narrowed it sharply: all three labs agree on the
        facts (dispute-001) AND on the required reframing ("interpretive synthesis, not a
        new mechanism" — GPT-5.5 Concern #8 == Fable 5 Concern #3). The residual is purely
        a PUBLISH-BAR STANDARD: "new mechanism/prediction required" (GPT-5.5 -> reject) vs
        "coherence + honest delineation + fresh framing suffices for foundations" (Fable 5,
        Gemini -> major revision). Much of the apparent gap is venue-scoping artifact (both
        agree it is NOT a results-journal paper). OUTCOME: STANDING DISSENT (protocol s4),
        narrowed to that single criterion. Facilitator (Claude) recorded a 4th view but
        did NOT cast a tie-breaking significance vote.
      routes_to: [assessment.md, resolution/dispute-002-retirement-path.md, "experiment.md:T6"]
      retirable_by: >
        Develop the Heisenberg-cut-as-measurable-locking-threshold into a concrete
        falsifiable prediction — the one lever that would cross even GPT-5.5's stricter bar
        ("new testable prediction"), converting the value-judgment into testable content.
        DRAFTED 2026-06-25 at resolution/dispute-002-retirement-path.md: a SNIC bifurcation
        at the measurement reversibility boundary (exponent 1/2, sub-threshold phase slips,
        catch-and-reverse edge on the Arnold tongue), DERIVED from a circuit-QED model so it
        also discharges dispute-001's "Adler asserted not derived." Added to experiment.md as
        T6. PART I EXECUTED 2026-06-25 (resolution/dispute-002-partI-Keff.py): K_eff = 4 chi^2
        nbar/kappa derived from the transmon+readout master eq; Gamma_phi matches 8chi^2nbar/kappa
        to 1%, master eq reduces to phi_dot=Omega-K_eff sin2phi exactly (harmonics ~1e-11),
        SNIC critical exponent = 0.495 (predicts 1/2), slip rate ratio = 1.000. Cut = readout-
        power threshold nbar_crit = kappa|Omega|/(4chi^2). PART II now a COMMIT-READY PROTOCOL
        (resolution/dispute-002-partII-protocol.md): transmon + continuous sz readout + Rabi
        drive; 4 measurements (Arnold tongue, critical-slowing exponent 1/2, sqrt-law slips,
        catch-and-reverse edge on the tongue) with pulse sequences + ~1 device-week estimate;
        open call to an invited circuit-QED group. Positive -> dissent converges to major-
        revision; null -> framework core falsified.

